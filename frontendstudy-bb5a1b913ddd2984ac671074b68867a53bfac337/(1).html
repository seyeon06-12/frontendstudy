<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>기사 페이지</title>
  <style>
  
    body { font-family: sans-serif; line-height: 1.6; max-width: 800px; margin: 0 auto; padding: 20px; }
    main { display: flex; gap: 20px; } /* 본문과 사이드바 가로 배치 */
    article { flex: 3; }
    aside { flex: 1; background: #f4f4f4; padding: 10px; }
    footer { margin-top: 20px; border-top: 1px solid #ccc; text-align: center; }
    
    nav a {
      position: relative;
      display: inline-block;
      width: 30px;
      height: 30px;
      color: white;
      text-align: center;
      line-height: 30px;
      font-size: 12px;
      text-decoration: none;
      margin: 10px;
    }
    
    nav a::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #333;
      clip-path: polygon(50% 0%, 100% 35%, 100% 100%, 0% 100%, 0% 35%);
      z-index: -1;
    }
    
    nav a:hover::before {
      background: #555;
    }
  </style>
</head>


<body>

  <header>
    <nav>
      <a href="#home">홈</a>
    </nav>
  </header>

  <main>
    <article>
      <h1>제목</h1>
      <section>
        <p>내용이 들어가는 곳입니다.</p>
        <p>1. 첫 번째 문단</p>
        <p>2. 두 번째 문단</p>  
      </section>
    </article>

    <aside>
      관련 정보
    </aside>
  </main>

  <footer>
    <p>&copy; 2026 회사명</p>
  </footer>

</body>
</html>
